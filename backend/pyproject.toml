[project]
name = "road-analysis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "av>=19.0.2",
    "boto3>=1.44.4",
    "pillow>=13.0.0",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.15"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true

